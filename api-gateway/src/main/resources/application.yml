server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
        - id: event-service-route
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/events/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/