server:
  port: 8081

spring:
  application:
    name: user-service

#  jackson:
#    time-zone: Asia/Kolkata

  datasource:
    url: jdbc:postgresql://postgres-db:5432/event_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka